services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-datn2_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-defaultdb}
      MYSQL_USER: ${MYSQL_USER:-datn2_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datn2_pass_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schemas/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-datn2_root_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-datn2_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datn2_pass_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-defaultdb}
      FORCE_CPU: ${FORCE_CPU:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./weights:/app/weights:ro

volumes:
  mysql_data:
