openapi: 3.1.0
info:
  title: DATN2 School Parking Gate AI API
  version: 2.0.0
  description: >
    REST API contract for DATN2 (2-Camera WebRTC License Plate & FaceNet Biometric
    Parking Gate Management System with Local MySQL & WarmDatabaseMirror).
servers:
  - url: http://127.0.0.1:8000
    description: Local FastAPI server

tags:
  - name: UI
    description: Static WebRTC dashboard entrypoint
  - name: Camera & Gate
    description: Dual-camera control, frame ingestion, Two-Phase Latch, and Security Alerts
  - name: Management
    description: Parking history, KPIs, revenue reporting, lost-vehicle case lookup, and DB reconnect
  - name: Observability
    description: Health checks and runtime AI/DB telemetry

paths:
  /:
    get:
      tags: [UI]
      summary: Serve web application index
      responses:
        "200":
          description: HTML entrypoint (Cache-Control no-cache)
          content:
            text/html:
              schema:
                type: string
    head:
      tags: [UI]
      summary: Check web application index availability
      responses:
        "200":
          description: OK

  /ui:
    get:
      tags: [UI]
      summary: Serve web application index alias
      responses:
        "200":
          description: HTML entrypoint (Cache-Control no-cache)
          content:
            text/html:
              schema:
                type: string
    head:
      tags: [UI]
      summary: Check web application index alias availability
      responses:
        "200":
          description: OK

  /api/camera/status:
    get:
      tags: [Camera & Gate]
      summary: Get dual-camera, latch, security alert, feedback, and readiness status
      responses:
        "200":
          description: Current gate status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateStatusResponse"

  /api/camera/{cam_id}/start:
    post:
      tags: [Camera & Gate]
      summary: Start an individual browser camera unit (1 or 2)
      parameters:
        - name: cam_id
          in: path
          required: true
          schema:
            type: integer
            enum: [1, 2]
      responses:
        "200":
          description: Camera started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "400":
          description: Invalid camera state or start failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invalid cam_id (must be 1 or 2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/camera/{cam_id}/stop:
    post:
      tags: [Camera & Gate]
      summary: Stop an individual camera unit (1 or 2) without interrupting the other or in-flight DB commits
      parameters:
        - name: cam_id
          in: path
          required: true
          schema:
            type: integer
            enum: [1, 2]
      responses:
        "200":
          description: Camera stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          description: Invalid cam_id (must be 1 or 2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/camera/stop:
    post:
      tags: [Camera & Gate]
      summary: Stop both cameras without cancelling in-flight DB commits
      responses:
        "200":
          description: Both cameras stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopAllCamerasResponse"

  /api/camera/browser-frame:
    post:
      tags: [Camera & Gate]
      summary: Ingest base64 JPEG frames from Cam 1 and/or Cam 2 for YOLO + FaceNet + Latch processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DualFrameIngestRequest"
      responses:
        "200":
          description: Overlay bounding boxes and updated gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualFrameIngestResponse"

  /api/camera/cancel-latch:
    post:
      tags: [Camera & Gate]
      summary: Cancel active Two-Phase Latch and clear camera vote observations
      responses:
        "200":
          description: Latch cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelLatchResponse"

  /api/camera/resolve-alert:
    post:
      tags: [Camera & Gate]
      summary: Approve or reject an active FaceNet mismatch Security Alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAlertRequest"
      responses:
        "200":
          description: Resolution outcome (approved, rejected, db_error, or none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAlertResponse"

  /api/management/overview:
    get:
      tags: [Management]
      summary: Query KPI stats, optional revenue breakdown, and filtered/paginated parking history
      parameters:
        - name: q
          in: query
          schema:
            type: string
            default: ""
          description: Plate search query (case/hyphen insensitive)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, in_parking, direction_in, direction_out]
            default: all
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
            minimum: 1
            maximum: 1000
          description: Optional hard row limit (overrides page/page_size when provided)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
        - name: include_records
          in: query
          schema:
            type: boolean
            default: true
        - name: include_revenue
          in: query
          schema:
            type: ["boolean", "null"]
          description: Include daily/monthly/yearly revenue report (defaults to true on server when omitted)
        - name: sort
          in: query
          schema:
            type: string
            enum: ["", mismatch_first, matched_first]
            default: ""
      responses:
        "200":
          description: Management overview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementOverviewResponse"

  /api/management/session-case/{record_id}:
    get:
      tags: [Management]
      summary: Fetch paired Check-in and Check-out records for lost-vehicle investigation
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paired session case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCaseResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MySQL unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/management/reconnect:
    post:
      tags: [Management]
      summary: Manually trigger MySQL reconnection and WarmDatabaseMirror reload
      responses:
        "200":
          description: MySQL connected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconnectResponse"
        "503":
          description: MySQL connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/health:
    get:
      tags: [Observability]
      summary: Liveness and component readiness probe
      responses:
        "200":
          description: Component health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/metrics:
    get:
      tags: [Observability]
      summary: Runtime counters for gate inference, latches, security alerts, and DB commits
      responses:
        "200":
          description: Runtime metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

components:
  schemas:
    DualFrameIngestRequest:
      type: object
      additionalProperties: false
      properties:
        cam1_image:
          type: ["string", "null"]
          maxLength: 2500000
          description: Base64 JPEG or data URL from Cam 1
        cam2_image:
          type: ["string", "null"]
          maxLength: 2500000
          description: Base64 JPEG or data URL from Cam 2

    PlateOverlayBox:
      type: object
      required: [x1, y1, x2, y2, label, valid]
      properties:
        x1: { type: number, minimum: 0, maximum: 1 }
        y1: { type: number, minimum: 0, maximum: 1 }
        x2: { type: number, minimum: 0, maximum: 1 }
        y2: { type: number, minimum: 0, maximum: 1 }
        label: { type: string }
        valid: { type: boolean }

    FaceOverlayBox:
      type: object
      required: [x1, y1, x2, y2, label]
      properties:
        x1: { type: number, minimum: 0, maximum: 1 }
        y1: { type: number, minimum: 0, maximum: 1 }
        x2: { type: number, minimum: 0, maximum: 1 }
        y2: { type: number, minimum: 0, maximum: 1 }
        label: { type: string }

    OverlayBoxes:
      type: object
      required: [plates, faces]
      properties:
        plates:
          type: array
          items:
            $ref: "#/components/schemas/PlateOverlayBox"
        faces:
          type: array
          items:
            $ref: "#/components/schemas/FaceOverlayBox"

    VoteInfo:
      type: object
      required: [candidate, vote_count, sample_count, vote_share]
      properties:
        candidate: { type: string }
        vote_count: { type: integer, minimum: 1 }
        sample_count: { type: integer, minimum: 1 }
        vote_share: { type: number, minimum: 0, maximum: 1 }

    CameraUnitStatus:
      type: object
      required: [active, mode, device_index, current_plates, current_faces, ambiguous_frame, vote]
      properties:
        active: { type: boolean }
        mode: { type: string }
        device_index: { type: integer }
        current_plates:
          type: array
          items: { type: string }
        current_faces:
          type: array
          items: { type: string }
        ambiguous_frame: { type: boolean }
        vote:
          oneOf:
            - $ref: "#/components/schemas/VoteInfo"
            - type: "null"

    LatchState:
      type: object
      required: [direction, plate_number, plate_cam, required_face_cam, remaining_seconds, sampling_face]
      properties:
        direction:
          type: string
          enum: [IN, OUT]
        plate_number: { type: string }
        plate_cam:
          type: integer
          enum: [1, 2]
        required_face_cam:
          type: integer
          enum: [1, 2]
        remaining_seconds:
          type: integer
          minimum: 0
          maximum: 4
        sampling_face: { type: boolean }

    SecurityAlert:
      type: object
      required: [plate_number, entry_time, match_score_pct]
      properties:
        plate_number: { type: string }
        entry_time: { type: string }
        match_score_pct: { type: string }

    GateFeedback:
      type: object
      required: [seq, type, message, expires_at]
      properties:
        seq: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [success, warn, error, info]
        message: { type: string }
        expires_at: { type: number }

    GateStatusResponse:
      type: object
      required:
        - running
        - committing
        - cam1
        - cam2
        - latched
        - security_alert
        - gate_feedback
        - ambiguous_frame
        - error
        - records_version
        - database_ready
        - models_ready
        - face_match_threshold
      properties:
        running: { type: boolean }
        committing: { type: boolean }
        cam1:
          $ref: "#/components/schemas/CameraUnitStatus"
        cam2:
          $ref: "#/components/schemas/CameraUnitStatus"
        latched:
          oneOf:
            - $ref: "#/components/schemas/LatchState"
            - type: "null"
        security_alert:
          oneOf:
            - $ref: "#/components/schemas/SecurityAlert"
            - type: "null"
        gate_feedback:
          oneOf:
            - $ref: "#/components/schemas/GateFeedback"
            - type: "null"
        ambiguous_frame: { type: boolean }
        error:
          type: ["string", "null"]
        records_version: { type: integer, minimum: 0 }
        database_ready: { type: boolean }
        models_ready: { type: boolean }
        face_match_threshold: { type: number }

    DualFrameIngestResponse:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        processed: { type: boolean }
        error: { type: string }
        cam1_boxes:
          oneOf:
            - $ref: "#/components/schemas/OverlayBoxes"
            - type: "null"
        cam2_boxes:
          oneOf:
            - $ref: "#/components/schemas/OverlayBoxes"
            - type: "null"
        status:
          $ref: "#/components/schemas/GateStatusResponse"

    CameraActionResponse:
      type: object
      required: [status, cam_id]
      properties:
        status:
          type: string
          enum: [started, stopped]
        cam_id:
          type: integer
          enum: [1, 2]
        mode: { type: string }
        device_index: { type: integer }

    StopAllCamerasResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: stopped

    CancelLatchResponse:
      type: object
      required: [status, camera_status]
      properties:
        status:
          type: string
          const: cancelled
        camera_status:
          $ref: "#/components/schemas/GateStatusResponse"

    ResolveAlertRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [approve, reject]

    ResolveAlertResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [approved, rejected, db_error, none]
        message: { type: string }
        type:
          type: string
          enum: [warn, error]
        camera_status:
          $ref: "#/components/schemas/GateStatusResponse"

    ManagementStats:
      type: object
      required: [total_records, today_records, in_parking, total_in, total_out]
      properties:
        total_records: { type: integer, minimum: 0 }
        today_records: { type: integer, minimum: 0 }
        in_parking: { type: integer, minimum: 0 }
        total_in: { type: integer, minimum: 0 }
        total_out: { type: integer, minimum: 0 }

    RevenueSummaryBucket:
      type: object
      required: [tickets, revenue]
      properties:
        tickets: { type: integer, minimum: 0 }
        revenue: { type: integer, minimum: 0 }

    RevenuePeriodRow:
      type: object
      required: [period, tickets, unit_price, revenue]
      properties:
        period: { type: string }
        tickets: { type: integer, minimum: 0 }
        unit_price: { type: integer, minimum: 0 }
        revenue: { type: integer, minimum: 0 }

    RevenueReport:
      type: object
      required: [unit_price, today, month, year, total, daily, monthly, yearly]
      properties:
        unit_price: { type: integer, const: 2000 }
        today:
          $ref: "#/components/schemas/RevenueSummaryBucket"
        month:
          $ref: "#/components/schemas/RevenueSummaryBucket"
        year:
          $ref: "#/components/schemas/RevenueSummaryBucket"
        total:
          $ref: "#/components/schemas/RevenueSummaryBucket"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePeriodRow"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePeriodRow"
        yearly:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePeriodRow"

    ParkingRecordRow:
      type: object
      required:
        - ID
        - Biển số
        - direction_code
        - parking_status_code
        - entry_record_id
        - face_match_score
        - Luồng
        - Trạng thái bãi
        - Thời gian nhận diện
        - Khuôn mặt
        - Đối chiếu
        - plate_image
        - face_image
      properties:
        ID: { type: integer, minimum: 1 }
        Biển số: { type: string }
        direction_code:
          type: string
          enum: [IN, OUT]
        parking_status_code:
          type: string
          enum: [IN_PARKING, COMPLETED, EXITED]
        entry_record_id: { type: ["integer", "null"] }
        face_match_score: { type: ["number", "null"] }
        Luồng:
          type: string
          enum: ["Vào bãi", "Ra bãi"]
        Trạng thái bãi:
          type: string
          enum: ["Đang gửi", "Đã lấy xe", "Đã ra bãi"]
        Thời gian nhận diện:
          type: string
          description: Naive UTC+7 timestamp formatted YYYY-MM-DD HH:MM:SS
        Khuôn mặt: { type: string }
        Đối chiếu: { type: string }
        plate_image: { type: ["string", "null"] }
        face_image: { type: ["string", "null"] }

    ManagementOverviewResponse:
      type: object
      required: [database_ready, database_error, stats, revenue, matched, page, records, records_version]
      properties:
        database_ready: { type: boolean }
        database_error: { type: ["string", "null"] }
        stats:
          oneOf:
            - $ref: "#/components/schemas/ManagementStats"
            - type: "null"
        revenue:
          oneOf:
            - $ref: "#/components/schemas/RevenueReport"
            - type: "null"
        matched: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        records:
          type: array
          items:
            $ref: "#/components/schemas/ParkingRecordRow"
        records_version: { type: integer, minimum: 0 }

    SessionCaseResponse:
      type: object
      required: [target_id, plate_number, checkin_row, checkout_row, in_parking_status, session_closed_missing_exit]
      properties:
        target_id: { type: integer, minimum: 1 }
        plate_number: { type: string }
        checkin_row:
          oneOf:
            - $ref: "#/components/schemas/ParkingRecordRow"
            - type: "null"
        checkout_row:
          oneOf:
            - $ref: "#/components/schemas/ParkingRecordRow"
            - type: "null"
        in_parking_status: { type: string }
        session_closed_missing_exit: { type: boolean }

    ReconnectResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    HealthResponse:
      type: object
      required: [status, database_ready, models_ready, face_encoder_ready, warm_mirror_ready, uptime_seconds, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database_ready: { type: boolean }
        models_ready: { type: boolean }
        face_encoder_ready: { type: boolean }
        warm_mirror_ready: { type: boolean }
        uptime_seconds: { type: number, minimum: 0 }
        version: { type: string }

    MetricsResponse:
      type: object
      required:
        - frames_received
        - frames_processed
        - frames_skipped_busy
        - frames_deduplicated
        - plates_detected
        - faces_detected
        - latches_started
        - latches_committed
        - latches_cancelled
        - latches_timed_out
        - security_alerts_triggered
        - security_alerts_approved
        - security_alerts_rejected
        - db_commits_succeeded
        - db_commits_failed
        - records_version
        - warm_mirror_count
      properties:
        frames_received: { type: integer, minimum: 0 }
        frames_processed: { type: integer, minimum: 0 }
        frames_skipped_busy: { type: integer, minimum: 0 }
        frames_deduplicated: { type: integer, minimum: 0 }
        plates_detected: { type: integer, minimum: 0 }
        faces_detected: { type: integer, minimum: 0 }
        latches_started: { type: integer, minimum: 0 }
        latches_committed: { type: integer, minimum: 0 }
        latches_cancelled: { type: integer, minimum: 0 }
        latches_timed_out: { type: integer, minimum: 0 }
        security_alerts_triggered: { type: integer, minimum: 0 }
        security_alerts_approved: { type: integer, minimum: 0 }
        security_alerts_rejected: { type: integer, minimum: 0 }
        db_commits_succeeded: { type: integer, minimum: 0 }
        db_commits_failed: { type: integer, minimum: 0 }
        records_version: { type: integer, minimum: 0 }
        warm_mirror_count: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
