name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python syntax check (compileall)
        run: python -m compileall -q src tests

      - name: Architecture & size guardrails
        run: python scripts/check_guardrails.py

      - name: Schema & MCP config validation
        run: python scripts/validate_schemas.py

      - name: Python static lint (ruff)
        run: ruff check src tests scripts

      - name: Frontend JS syntax check
        run: |
          if [ -d "src/frontend/js" ]; then
            shopt -s globstar nullglob
            files=(src/frontend/js/**/*.js)
            if [ ${#files[@]} -gt 0 ]; then
              for f in "${files[@]}"; do
                node --check "$f"
              done
              echo "JS SYNTAX OK (${#files[@]} files)"
            else
              echo "SKIP: no JS files in src/frontend/js"
            fi
          else
            echo "SKIP: src/frontend/js not present"
          fi

      - name: Run automated tests (pytest)
        run: python -m pytest
